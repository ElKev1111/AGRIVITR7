<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      lang="es">

<h:head>
    <title>Envío de Correos</title>

    <!-- Bootstrap, Tailwind y FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
        }
        .sidebar {
            position: fixed;
            top: 0; left: 0;
            height: 100vh;
            width: 230px;
            background: #008631;
            color: white;
            z-index: 1000;
            overflow-y: auto;
        }
        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        .sidebar-nav .nav-link {
            display: flex; align-items: center;
            padding: 10px 18px;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
        }
        .sidebar-nav .nav-link:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .sidebar-nav .nav-link.active {
            background: rgba(255,255,255,0.2);
            color: white;
            border-right: 4px solid #ffd700;
        }
        .main-content {
            margin-left: 260px;
            padding: 2rem;
        }
        .top-bar {
            background-color: gainsboro;
            padding: 1rem 2rem;
            border-bottom: 1px solid #e9ecef;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            padding: 20px;
        }
    </style>
</h:head>

<h:body>

     <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h4><i class="fa fa-leaf"></i> Agrivi</h4>
                <p>Panel Admin</p>
            </div>

            <nav class="sidebar-nav">
                     <nav class="sidebar-nav">
            <h:link outcome="/HomeAdmin1.xhtml" styleClass="nav-link">
                        <i class="fas fa-user"></i> Dashboard 
                    </h:link>
                    <h:link outcome="/HomeAdmin2.xhtml" styleClass="nav-link">
                        <i class="fas fa-jar"></i> Usuarios
                    </h:link>
                    <h:link outcome="/HomeAdmin3.xhtml" styleClass="nav-link">
                        <i class="fas fa-user"></i> Productos 
                    </h:link>
                    <h:link outcome="/Correos.xhtml" styleClass="nav-link">
                        <i class="fas fa-envelope"></i> Correos
                    </h:link>
                    <h:link outcome="/HomeAdmin4.xhtml" styleClass="nav-link">
                        <i class="fas fa-envelope"></i> Ventas
                    </h:link>
                    <h:link outcome="/HomeAdmin5.xhtml" styleClass="nav-link">
                        <i class="fas fa-users"></i> Empleados
                    </h:link>
                    <h:link outcome="/MovInventario.xhtml" styleClass="nav-link active">
                        <i class="fas fa-boxes"></i> Inventario
                    </h:link>
                    <h:link outcome="/dashboardCliente.xhtml" styleClass="nav-link active">
                        <i class="fas fa-eye"></i> Vista Cliente
                    </h:link>
        </nav>

            </nav>

            <h:form>
                <div class="sidebar-footer">
                      <h:commandLink action="#{usuarioBean.logout()}" styleClass="btn btn-outline-light btn-sm w-100">
                        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                    </h:commandLink>
                </div>
            </h:form>
        </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="top-bar d-flex justify-content-between align-items-center">
            <h2><i class="fas fa-envelope"></i> Envío de Correos</h2>
            <div class="user-info">
                <span class="me-3">Bienvenido, <strong>#{usuarioBean.usuario.nombre} Kevin</strong></span>
            </div>
        </div>

        <div class="mt-5">
            <p:growl id="msj" showSummary="true" showDetail="true" />
            <f:event type="preRenderView" listener="#{correoBean.listarUsuarios()}" />

            <div class="card">
                <h:form>
                    <h:panelGrid columns="2" styleClass="w-100">
                        
                        <!-- Selección de destinatarios -->
                        <h:panelGrid columns="1">
                            <p:outputLabel value="Destinatarios" />
                            <p:selectManyMenu value="#{correoBean.dest}" showCheckbox="true" style="width: 250px;"
                                              widgetVar="dest" required="true" requiredMessage="Debe selecciona Usuarios">
                                <f:selectItems value="#{correoBean.listaUsr}" var="usr" 
                                               itemLabel="#{usr.nombre}" itemValue="#{usr.correo}" />
                            </p:selectManyMenu>
                            <h:panelGrid columns="2" style="margin-top: 10px;">
                                <p:commandButton value="T" onclick="PF('dest').selectAll()" styleClass="btn btn-success btn-sm"/>
                                <p:commandButton value="N" onclick="PF('dest').unselectAll()" styleClass="btn btn-danger btn-sm"/>
                            </h:panelGrid>
                        </h:panelGrid>

                        <!-- Asunto y Mensaje -->
                        <h:panelGrid columns="1">
                            <p:outputLabel value="Asunto" />
                            <p:inputText value="#{correoBean.asunto}" size="40" 
                                         required="true" requiredMessage="Debe especificar un asunto" />
                            <p:outputLabel value="Mensaje" style="margin-top: 10px;" />
                            <p:inputTextarea value="#{correoBean.contmensaje}" rows="6" cols="40"
                                             required="true" requiredMessage="Debe especificar un mensaje" />
                            <h:panelGrid columns="2" style="margin-top: 15px;">
                                <p:commandButton value="Enviar" ajax="false" actionListener="#{correoBean.enviarCorreo()}" styleClass="btn btn-primary"/>
                                <p:commandButton value="Cancelar" ajax="false" immediate="true" action="/admin" styleClass="btn btn-secondary"/>
                            </h:panelGrid>
                        </h:panelGrid>

                    </h:panelGrid>
                </h:form>
            </div>
        </div>
    </div>
</h:body>
</html>
