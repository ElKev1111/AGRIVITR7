<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AgriviApp - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
          rel="stylesheet"/>
    <style>
        /* Estilos de Coherencia con AgriviApp */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e6f5ed; /* Fondo claro de la aplicación */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #ffffff;
            /* Sombra con un toque del color principal para darle profundidad */
            box-shadow: 0 10px 25px rgba(11, 148, 70, 0.15); 
            border-radius: 1rem;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
        }
        .btn-primary {
            background-color: #0b9446; /* Verde primario de AgriviApp */
            transition: background-color 0.2s ease-in-out;
        }
        .btn-primary:hover {
            background-color: #097a3a; /* Verde más oscuro al pasar el ratón */
        }
        /* Estilos para h:messages */
        .alert-error {
            background-color: #fee2e2; /* Rojo suave */
            color: #ef4444; /* Rojo fuerte */
        }
        .alert-success {
            background-color: #d1fae5; /* Verde muy claro */
            color: #0b9446; /* Verde primario */
        }
        /* Estilos de enfoque para inputs */
        .focus-ring-green:focus {
            border-color: #0b9446;
            box-shadow: 0 0 0 1px #0b9446, 0 0 0 3px rgba(11, 148, 70, 0.2);
        }
        .text-green-700 {
            color: #097a3a; /* Verde secundario para enlaces */
        }
    </style>
</h:head>

<h:body>

    <div class="login-card">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">
                AgriviApp
            </h1>
            <h2 class="text-xl font-semibold text-green-700 mt-2">
                Inicio de Sesión
            </h2>
        </div>

        <h:messages globalOnly="true" layout="table"
                    styleClass="p-3 rounded-md mb-6 text-sm w-full"
                    errorClass="alert-error"
                    infoClass="alert-success"
                    warnClass="alert-error"
                    fatalClass="alert-error"/>

        <h:form styleClass="space-y-6">

            <div>
                <label for="correo" class="block text-sm font-medium text-gray-700 mb-1">
                    Correo Electrónico
                </label>
               <h:inputText id="correo" 
                            value="#{usuarioBean.usuario.correo}" 
                            required="true"
                            requiredMessage="El Correo es obligatorio."
                            styleClass="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus-ring-green sm:text-sm"/>
            </div>

            <div>
                <label for="contrasena" class="block text-sm font-medium text-gray-700 mb-1">
                    Contraseña
                </label>
                <h:inputSecret id="contrasena" 
                               value="#{usuarioBean.usuario.password}" 
                               required="true"
                               requiredMessage="La Contraseña es obligatoria."
                               styleClass="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus-ring-green sm:text-sm"/>
            </div>

            <div>
                <h:commandButton value="Iniciar Sesión"
                                 action="#{usuarioBean.autenticar}"
                                 styleClass="btn-primary w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-md text-lg font-medium text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500"/>
            </div>

        </h:form>

        <p class="mt-6 text-center text-sm text-gray-600">
            ¿No tienes una cuenta?
            <h:link outcome="register" value="Regístrate aquí"
                    styleClass="font-medium text-green-700 hover:text-green-900"/>
        </p>
    </div>

</h:body>
</html>
