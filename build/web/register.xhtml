<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Registro - AgriviApp</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
          rel="stylesheet"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fdf4;
        }
        .btn-primary {
            background-color: #10B981;
        }
        .btn-primary:hover {
            background-color: #059669;
        }
        .alert-error {
            background-color: #fee2e2;
            color: #ef4444;
        }
        .alert-success {
            background-color: #d1fae5;
            color: #10b981;
        }
    </style>
</h:head>

<h:body class="min-h-screen flex items-center justify-center p-6">

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-lg">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Registro de Usuario</h2>

        <!-- Mensajes de validación -->
        <h:messages globalOnly="true" layout="table"
                    styleClass="p-3 rounded-md mb-4 text-sm"
                    errorClass="alert-error"
                    infoClass="alert-success"
                    warnClass="alert-error"
                    fatalClass="alert-error"/>

        <h:form styleClass="space-y-6">

            <!-- Nombre -->
            <div>
                <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                <h:inputText id="nombre" value="#{usuarioBean.usuario.nombre}" required="true"
                             styleClass="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm"/>
            </div>

            <!-- Correo -->
            <div>
                <label for="correo" class="block text-sm font-medium text-gray-700 mb-1">Correo</label>
                <h:inputText id="correo" value="#{usuarioBean.usuario.correo}" required="true"
                             styleClass="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm"/>
            </div>

            <!-- Celular -->
            <div>
                <label for="celular" class="block text-sm font-medium text-gray-700 mb-1">Celular</label>
                <h:inputText id="celular" value="#{usuarioBean.usuario.celular}" required="true"
                             styleClass="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm"/>
            </div>

            <!-- Dirección -->
            <div>
                <label for="direccion" class="block text-sm font-medium text-gray-700 mb-1">Dirección</label>
                <h:inputText id="direccion" value="#{usuarioBean.usuario.direccion}" required="true"
                             styleClass="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm"/>
            </div>
         

            <!-- Contraseña -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <h:inputSecret id="password" value="#{usuarioBean.usuario.password}" required="true"
                               styleClass="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm"/>
            </div>

            <!-- Botón -->
            <div>
                <h:commandButton value="Registrarse"
                                 action="#{usuarioBean.agregar()}"
                                 styleClass="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white btn-primary"/>
            </div>
        </h:form>

        <p class="mt-6 text-center text-sm text-gray-600">
            ¿Ya tienes cuenta?
            <h:link outcome="login" value="Inicia Sesión"
                    styleClass="font-medium text-emerald-600 hover:text-emerald-500"/>
        </p>
    </div>

</h:body>
</html>
